[project]
name = "ph-il-analysis"
version = "0.1.0"
description = "Reproduction package for persistent-homology analysis of ionic-liquid / graphene-interface Na+ diffusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "python-docx>=1.0",
    "homcloud>=5.3",
]

[tool.uv]
package = false
